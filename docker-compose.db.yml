# PostgreSQL-only Docker Compose for local development
# Used by setup.sh when local PostgreSQL is not available
#
# Usage:
#   docker-compose -f docker-compose.db.yml up -d
#   docker-compose -f docker-compose.db.yml down
#
# Connection string:
#   postgresql://current:current_password@localhost:5556/current_db

services:
  postgres:
    image: postgres:16-alpine
    container_name: current_db
    environment:
      POSTGRES_USER: current
      POSTGRES_PASSWORD: current_password
      POSTGRES_DB: current_db
    ports:
      - "5556:5432"
    volumes:
      - current_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U current -d current_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  current_db_data:
