# ══════════════════════════════════════════════════════════
# Current - Local Development Stack
# ══════════════════════════════════════════════════════════
# Full local stack with backend and PostgreSQL
#
# Usage:
#   docker-compose up -d              # Start all services
#   docker-compose up -d --build      # Rebuild and start
#   docker-compose down               # Stop all services
#   docker-compose logs -f app        # Follow app logs
#   docker-compose logs -f postgres   # Follow db logs
#
# First time setup:
#   1. Copy .env.example to .env and fill in values
#   2. Run: docker-compose up -d
#   3. Access app at: http://localhost:5000
# ══════════════════════════════════════════════════════════

services:
  # ─────────────────────────────────────────────────────────
  # PostgreSQL Database
  # ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: current_db
    environment:
      POSTGRES_USER: current
      POSTGRES_PASSWORD: current_password
      POSTGRES_DB: current_db
    ports:
      - "5556:5432"
    volumes:
      - current_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U current -d current_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - current_network

  # ─────────────────────────────────────────────────────────
  # Current Backend Application
  # ─────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: current_app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      HOST: 0.0.0.0
      # Database connection (internal Docker network)
      DATABASE_URL: postgresql://current:current_password@postgres:5432/current_db
    env_file:
      - .env
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    restart: unless-stopped
    networks:
      - current_network

# ─────────────────────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────────────────────
volumes:
  current_db_data:

# ─────────────────────────────────────────────────────────
# Networks
# ─────────────────────────────────────────────────────────
networks:
  current_network:
    driver: bridge
